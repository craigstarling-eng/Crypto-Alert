name: Crypto Alert

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          ALERT_1H_PCT: ${{ vars.ALERT_1H_PCT }}
          ALERT_24H_PCT: ${{ vars.ALERT_24H_PCT }}
          COOLDOWN_MIN: ${{ vars.COOLDOWN_MIN }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python crypto_alert.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
